# Configuration for slf4j-simple, the SLF4J binding the desktop app runs with. Read from the
# classpath at startup; see `runtimeOnly(libs.slf4j.simple)` in build.gradle.kts for why it is here.

# WARN rather than slf4j-simple's own INFO default: vlcj narrates its native-library discovery and
# Ktor its engine setup at INFO, which is noise on every launch. Warnings and errors are the part
# worth seeing — a libVLC that loaded the wrong plugin directory reports itself here.
org.slf4j.simpleLogger.defaultLogLevel=warn

# stderr, so log output stays out of anything reading the app's stdout, and readable when it appears.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
