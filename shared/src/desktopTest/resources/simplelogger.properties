# Configuration for slf4j-simple, the SLF4J binding the desktop tests run with. The app has its own
# copy under `desktopApp/src/main/resources` — neither can see the other's classpath, so they are two
# files rather than one shared setting.

# WARN rather than slf4j-simple's own INFO default, so a passing run says nothing: `VlcjPlayerEngine`
# narrates its native-library discovery at INFO on every test that touches libVLC. What is left is
# the part that explains a failure — a plugin directory libVLC would not load, for one.
org.slf4j.simpleLogger.defaultLogLevel=warn

org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
